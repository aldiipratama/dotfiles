name: 🐛 Bug Report
description: Report something that isn't working as expected or a bug unexpected behavior.
title: "[BUG] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Thanks for taking the time to report this bug! ❤️

        Please fill out the information below.

  - type: dropdown
    id: priority
    attributes:
      label: 🚨 Priority
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 🧩 Component
      options:
        - Frontend
        - Backend
        - API
        - Database
        - CI/CD
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📋 Description
      description: What happened?
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔄 Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected Behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual Behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📸 Screenshots / Logs
      render: shell

  - type: input
    id: version
    attributes:
      label: 📦 Version
      placeholder: v1.2.3

  - type: dropdown
    id: os
    attributes:
      label: 💻 Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - iOS
        - Other

  - type: textarea
    id: additional
    attributes:
      label: 📝 Additional Context
      placeholder: Anything else?
