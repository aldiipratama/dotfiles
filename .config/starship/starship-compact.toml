"$schema" = "https://starship.rs/config-schema.json"

# ==========================================================
# Global
# ==========================================================

add_newline = true
command_timeout = 1000
scan_timeout = 1000

format = """
$username\
$line_break\
$os\
$hostname\
$directory\
$line_break\
$git_branch\
$git_status\
${custom.stack}\
$cmd_duration\
$character\
"""

# ==========================================================
# Palette
# Catppuccin Mocha
# ==========================================================

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"

text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"

overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"

surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"

base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ==========================================================
# Username
# ==========================================================

[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[╭─ ](bold green)[⟦](bold yellow) [$user]($style) 󰪫 [Frontend Developer](bold mauve) [⟧](bold yellow)"

# ==========================================================
# OS
# ==========================================================

[os]
disabled = false
style = "bold sky"
format = "[├─ ](bold green)[$symbol]($style)"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Arch = "󰣇 "
Fedora = "󰣛 "
Linux = "󰌽 "
Macos = "󰀵 "

# ==========================================================
# Hostname
# ==========================================================

[hostname]
ssh_only = false
trim_at = "."
style = "bold teal"
format = "[$hostname]($style) "

# ==========================================================
# Directory
# ==========================================================

[directory]
style = "bold yellow"
read_only = " "
truncation_symbol = ".../"
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"
format = "[$path]($style)[$read_only](red)"

# ==========================================================
# Git Branch
# ==========================================================

[git_branch]
symbol = " "
style = "bold lavender"
format = "([├─](green) [$symbol$branch]($style))"

# ==========================================================
# Git Status
# ==========================================================

[git_status]
style = "bold peach"

ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

conflicted = "=${count}"
deleted = "-${count}"
renamed = "»${count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
stashed = "*${count}"

format = " ([$all_status$ahead_behind]($style)\n)"

# ==========================================================
# Stack
# Seluruh logic berada di project-stack.sh
# ==========================================================

[custom.stack]
description = "Project Stack"
command = "~/.config/starship/scripts/project-stack.sh"
when = "test -x ~/.config/starship/scripts/project-stack.sh"
style = "bold green"
shell = ["bash", "--noprofile", "--norc"]
format = "([├─ ](bold green) $output\n)"

# ==========================================================
# Command Duration
# ==========================================================

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "bold peach"
format = "([├─](green) 󱎫 [$duration]($style)\n)"

# ==========================================================
# Character
# ==========================================================

[character]
success_symbol = "[╰─ 󰮯](bold green)"
error_symbol = "[╰─](bold green) [󰚌](bold red)"
vimcmd_symbol = "[╰─ 󰊠](bold blue)"

